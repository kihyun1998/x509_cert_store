# Pub constraint updates for the package root and example/, and the workflows' actions.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
  - package-ecosystem: pub
    directory: /example
    schedule:
      interval: monthly
    groups:
      example:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
